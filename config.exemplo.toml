# Exemplo de configuração. O jeito mais fácil é usar o app (python -m precos --cadastro):
# ele cria e edita o config.toml para você. Se preferir editar à mão, copie este arquivo
# para config.toml.

# Aparência da janela de aviso (também dá para trocar no topo do app).
# [aparencia]
# tema = "sistema"   # "sistema", "claro" ou "escuro"

# IA (opcional). No app: Configurações → Pesquisa com IA.
# [ia]
# conexoes = ["claude_code", "codex"]  # em ordem: se o limite do plano acabar na 1ª, usa a próxima
#                                      # "claude_code" e "codex" usam o plano que você já paga, pelo programa
#                                      # instalado; "claude" e "openai" usam chave de API (pago por uso)
# limite_gasto_mensal = 5              # em dólares, só para chave de API
# [ia.modelos.claude_code]
# economica = "haiku"                  # haiku, sonnet ou opus (vazio = padrão do programa)

# Cada [[itens]] é uma coisa que você quer comprar.
#   nome          nome que aparece no aviso
#   buscas        o que você digitaria numa loja (pode ser mais de uma). Não precisa de link:
#                 o monitor busca no Zoom e também descobre sozinho a categoria certa, com filtro
#                 e do mais barato ao mais caro, para achar produtos com histórico de preço.
#   modo          "promocao"    = só avisa promoção de verdade (ou oferta sem histórico)
#                 "mais_barato" = também avisa quando aparece o menor preço já visto
#   limite_total  preço máximo, considerando o TOTAL PARCELADO no cartão sem juros (opcional)
#   limite_vista  preço máximo à vista, no PIX ou boleto (opcional; pode usar junto com o de cima)
#   polegadas_min / polegadas_max   tamanho da tela (opcional)
#   hz_min        taxa de atualização mínima, para monitores (opcional)
#   marcas        só aceita estas marcas (vazio = qualquer uma)
#   exigir        palavras que precisam estar no nome (ex.: o código do modelo)
#   excluir       palavras que eliminam o anúncio
#   ordem         "menor_preco" (padrão) = o mais barato primeiro
#                 "parcelas"    = ofertas em 10x ou mais primeiro, depois o mais barato
#   pesquisa      uso de IA: "nenhuma" (padrão), "economica" ou "completa"
#   descricao     o que você quer, em texto livre (usado pela IA)

[[itens]]
nome = "Ryzen 7 5700X"
buscas = ["ryzen 7 5700x"]
exigir = ["5700X"]          # palavra inteira: não pega o 5700X3D
modo = "mais_barato"

[[itens]]
nome = "Monitor 144Hz"
buscas = ["monitor 144hz", "monitor gamer ips"]
modo = "mais_barato"
polegadas_min = 23.8
polegadas_max = 27
hz_min = 144
marcas = ["LG", "Samsung", "AOC", "Dell", "ASUS", "Acer", "Gigabyte", "MSI", "Philips", "Pichau"]
excluir = ["TN", "Portátil", "Portatil"]

[[itens]]
nome = "TV 32-40"
buscas = ["smart tv 32", "smart tv 40"]
modo = "promocao"
limite_total = 1500
polegadas_min = 32
polegadas_max = 40
marcas = ["Samsung", "LG", "TCL", "Philips", "AOC"]
exigir = ["Smart"]
